<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation 💕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(120deg, #ee9ca7, #ffdde1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        h1 {
            color: white;
            font-size: 28px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 15px;
            animation: fadeIn 2s ease-in-out;
        }
        p {
            font-size: 20px;
            color: white;
            background: rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 20px;
            animation: fadeIn 3s ease-in-out;
        }
        .btn {
            padding: 12px 30px;
            font-size: 18px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 600;
            margin: 10px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        #whatsappBtn {
            background-color: #25D366;
            color: white;
        }
        #snapchatBtn {
            background-color: #FFFC00;
            color: black;
        }
        #instagramBtn {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
        }
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.3);
        }
        .btn img {
            width: 24px;
            height: 24px;
        }
        .gif-container {
            margin-top: 20px;
            animation: fadeIn 4s ease-in-out;
        }
        .gif-container img {
            width: 200px;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .watermark {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="watermark"> little something created with all my love, dedicated to Samoshri — the Engel of my heart. 🥹💕</div>

    
    <h1>YAYYYY! 🥳🎉</h1>
    <p>bolis vai kobe jabi are call korbi aj k 🥺💕</p>

    <div class="gif-container">
        <img src="https://media.giphy.com/media/xyGyp87gTXDbVPO5O0/giphy.gif">
        <img src="https://media.giphy.com/media/E4QK0D5v7RLkXIgVO7/giphy.gif">
    </div>

    <div>
        <a id="whatsappBtn" class="btn" href="https://wa.me/9883396106?text=I%20want%20to%20goooo%20%3A*" rel="noreferrer">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            Say hmm call korbo on WhatsApp
        </a>
        <a id="instagramBtn" class="btn" href="https://www.instagram.com/souvik.midya.167/" target="_blank" rel="noopener noreferrer">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
            Say hmm call korbo on Instagram
        </a>
    </div>

</body>
</html>
